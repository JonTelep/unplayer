# mpv binds 1-8 to contrast/brightness/gamma/saturation. A held "3" or a stray
# Super+3 workspace switch while the new window has focus turns the picture black.
1 ignore
2 ignore
3 ignore
4 ignore
5 ignore
6 ignore
7 ignore
8 ignore

# Volume on the mouse wheel and up/down arrows anywhere in the window
# (wheel-seeking a live stream is useless anyway). m = mute.
WHEEL_UP   add volume 5
WHEEL_DOWN add volume -5
UP         add volume 5
DOWN       add volume -5
